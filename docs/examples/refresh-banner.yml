# Erika 路线 C：GitHub Actions 定时生成（无需任何托管服务）
# 用法：把本文件复制到你自己的仓库 .github/workflows/refresh-banner.yml，
# 只需修改下方 env 里的 owner/repo 与输出路径。
#
# 原理：同时检出你的仓库和 Erika 工具仓库（固定版本），在工具目录里构建
# CLI，再把生成的 Banner 写回你的仓库。星标无变化时不产生提交。
# GITHUB_TOKEN 由 Actions 自动提供；如需更高配额可换成 PAT secret。

name: Refresh banner

env:
  ERIKA_REPO: Moemu/erika   # Erika 工具仓库（建议固定到 release tag）
  ERIKA_REF: main
  BANNER_OWNER: Moemu       # ← 改成你的 owner
  BANNER_REPO: Muika-After-Story   # ← 改成你的 repo
  BANNER_TEMPLATE: classic-stats   # classic / classic-stats
  BANNER_OUT: assets/banner.webp   # 输出路径（相对你的仓库根）

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # 你的仓库（工作目录）

      - name: Checkout Erika toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERIKA_REPO }}
          ref: ${{ env.ERIKA_REF }}
          path: .erika-tool

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .erika-tool/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .erika-tool/pnpm-lock.yaml

      - name: Build Erika CLI
        run: pnpm install --frozen-lockfile && pnpm -r build
        working-directory: .erika-tool

      - name: Render banner from live GitHub data
        run: |
          node .erika-tool/packages/cli/dist/cli.js render-live \
            --owner "$BANNER_OWNER" \
            --repo "$BANNER_REPO" \
            --template "$BANNER_TEMPLATE" \
            --out "$BANNER_OUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "erika-bot"
          git config user.email "erika-bot@users.noreply.github.com"
          git add "$BANNER_OUT"
          git diff --cached --quiet || (git commit -m "chore: refresh banner" && git push)
