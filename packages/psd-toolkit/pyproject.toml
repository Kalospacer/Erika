[project]
name = "erika-psd-toolkit"
license = {text = "MIT"}
version = "0.1.0"
description = "Erika: PSD banner template extractor (dev-time tool, not shipped in production images)"
requires-python = ">=3.10"
dependencies = [
    "psd-tools>=1.19",
    "Pillow>=10",
]

[project.scripts]
erika-psd = "psd_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
